# Builds the extension zip and attaches it to a GitHub release when the
# release is published. The tag must match the version in manifest.json
# (v0.4.0 for "version": "0.4.0"), so a release can never carry a zip that
# says it is something else.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the zip for, e.g. v0.4.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tag matches manifest version
        run: |
          version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match manifest version $version (expected v$version)"
            exit 1
          fi

      - name: Tests
        run: sh tools/test/run.sh

      - name: Preflight
        run: python tools/preflight.py

      - name: Pack
        run: python tools/pack.py

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" beej-*.zip --clobber
